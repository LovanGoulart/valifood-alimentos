{% extends "base.html" %}

{% block title %}Login - ValiFood{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">🥗</span>
            <h1>ValiFood</h1>
            <p>Controle inteligente de alimentos e validade</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required 
                       placeholder="seu@email.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Sua senha" autocomplete="current-password">
            </div>

            <div class="form-group form-checkbox">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Lembrar de mim</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div class="auth-footer">
            <p>Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}
